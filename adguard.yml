version: "3.9"

services:
  adguard:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    networks:
      - cloudflare
    volumes:
      - adguard_config:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work

networks:
  cloudflare:
    external: true

volumes:
  adguard_config:
    external: true
  adguard_work:
    external: true
