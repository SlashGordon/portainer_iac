version: "3.9"

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    networks: [cloudflare]
    ports:
      - "3000:3000"
      - "2222:2222"
    volumes:
      - /mnt/gitea:/data

  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: always
    depends_on: [gitea]
    networks: [cloudflare]
    environment:
      GITEA_RUNNER_NAME: CI-Runner
      CONFIG_FILE: /data/config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/gitea_runner_token
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        export GITEA_RUNNER_REGISTRATION_TOKEN="$(cat /run/secrets/gitea_runner_token)"
        exec /sbin/tini -- run.sh
    secrets:
      - source: gitea_runner_token
        uid: "1000"
        gid: "1000"
        mode: 0400
    configs:
      - source: act_runner_config
        target: /data/config.yaml

networks:
  cloudflare:
    external: true

volumes:
  runner_data:
    external: true

secrets:
  gitea_runner_token:
    file: /opt/portainer_iac/secrets/secrets/gitea/runner_token

configs:
  act_runner_config:
    content: |
      log:
        level: info

      runner:
        file: .runner
        capacity: 4
        timeout: 3h
        labels:
          - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"

      container:
        network: cloudflare
        valid_volumes:
            - "howtolosemoney-content-dev"
            - "howtolosemoney-content-prd"
            - "gitea-build-data"
            - "portfoliomanager-content-dev"
            - "portfoliomanager-content-prd"
            - "blog-astro-content-prd"
            - "druckzugpro-content-dev"
            - "druckzugpro-content-prd"
            - "partioplanner-content-dev"
            - "partioplanner-content-prd"