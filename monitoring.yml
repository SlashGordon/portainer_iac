services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/resolve-secrets.sh", "/run.sh"]
    environment:
      GF_INSTALL_PLUGINS: marcusolsson-dynamictext-panel,volkovlabs-echarts-panel
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: false
      GF_SECURITY_ADMIN_USER_FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_EMAIL_FILE: /run/secrets/grafana_admin_email
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - cloudflare
      - plg_net
    depends_on:
      - loki
    configs:
      - source: grafana_datasource_loki
        target: /etc/grafana/provisioning/datasources/loki.yml
      - source: resolve_secrets_script
        target: /scripts/resolve-secrets.sh
        mode: 0555
    secrets:
      - grafana_admin_user
      - grafana_admin_password
      - grafana_admin_email
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - loki-data:/loki
    networks:
      - plg_net
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - plg_net
    depends_on:
      - loki
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml

networks:
  cloudflare:
    external: true
  plg_net:
    driver: bridge

volumes:
  grafana-data:
  loki-data:

secrets:
  grafana_admin_user:
    file: /data/compose/secrets/grafana/grafana_admin_user
  grafana_admin_password:
    file: /data/compose/secrets/grafana/grafana_admin_password
  grafana_admin_email:
    file: /data/compose/secrets/grafana/grafana_admin_email

configs:
  promtail_config:
    file: ./monitoring/promtail-config.yml
  loki_config:
    file: ./monitoring/loki-config.yml
  grafana_datasource_loki:
    file: ./monitoring/datasource/loki.yml
  resolve_secrets_script:
    file: ./scripts/resolve-secrets.sh