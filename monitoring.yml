version: "3.9"

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        export GF_SECURITY_ADMIN_USER="$(cat /run/secrets/grafana_admin_user)"
        export GF_SECURITY_ADMIN_PASSWORD="$(cat /run/secrets/grafana_admin_password)"
        export GF_SECURITY_ADMIN_EMAIL="$(cat /run/secrets/grafana_admin_email)"
        exec /run.sh
    environment:
      GF_INSTALL_PLUGINS: marcusolsson-dynamictext-panel,volkovlabs-echarts-panel
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - cloudflare
      - plg_net
    depends_on:
      - loki
      - prometheus
    configs:
      - source: grafana_datasource_loki
        target: /etc/grafana/provisioning/datasources/loki.yml
      # NEU: Prometheus als Datenquelle provisionieren
      - source: grafana_datasource_prometheus
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provisioning
        target: /etc/grafana/provisioning/dashboards/default.yml
      - source: grafana_dashboard_nginx
        target: /var/lib/grafana/dashboards/nginx.json
      - source: grafana_dashboard_crowdsec
        target: /var/lib/grafana/dashboards/crowdsec.json
    secrets:
      - grafana_admin_user
      - grafana_admin_password
      - grafana_admin_email

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - loki-data:/loki
    networks:
      - plg_net
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - plg_net
    depends_on:
      - loki
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus-data:/prometheus
    networks:
      - plg_net
      - monitoring_net
    depends_on:
      - pve-exporter
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    restart: unless-stopped
    # The exporter prefers env-based config when PVE_USER is set.
    # Read Docker secrets and export env vars so it never falls back to /etc/prometheus/pve.yml.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        export PVE_USER="$(cat /run/secrets/pve_user)"
        export PVE_TOKEN_NAME="$(cat /run/secrets/pve_token_name)"
        export PVE_TOKEN_VALUE="$(cat /run/secrets/pve_token_value)"
        export PVE_VERIFY_SSL=false
        exec /opt/prometheus-pve-exporter/bin/pve_exporter
    networks:
      - plg_net
    secrets:
      - source: pve_user
        uid: "101"
        gid: "101"
        mode: 0444
      - source: pve_token_name
        uid: "101"
        gid: "101"
        mode: 0444
      - source: pve_token_value
        uid: "101"
        gid: "101"
        mode: 0444

networks:
  cloudflare:
    external: true
  plg_net:
    driver: bridge
  monitoring_net:
    external: true

volumes:
  grafana-data:
  loki-data:
  prometheus-data:

secrets:
  grafana_admin_user:
    file: /opt/portainer_iac/secrets/secrets/grafana/admin_user
  grafana_admin_password:
    file: /opt/portainer_iac/secrets/secrets/grafana/admin_password
  grafana_admin_email:
    file: /opt/portainer_iac/secrets/secrets/grafana/admin_email
  pve_user:
    file: /opt/portainer_iac/secrets/secrets/monitoring/pve_user
  pve_token_name:
    file: /opt/portainer_iac/secrets/secrets/monitoring/pve_token_name
  pve_token_value:
    file: /opt/portainer_iac/secrets/secrets/monitoring/pve_token_value

configs:
  promtail_config:
    file: ./monitoring/promtail-config.yml
  loki_config:
    file: ./monitoring/loki-config.yml
  grafana_datasource_loki:
    file: ./monitoring/datasource/loki.yml
  prometheus_config:
    file: ./monitoring/prometheus.yml
  grafana_datasource_prometheus:
    file: ./monitoring/datasource/prometheus.yml
  grafana_dashboard_provisioning:
    file: ./monitoring/dashboard-provisioning.yml
  grafana_dashboard_nginx:
    file: ./monitoring/dashboard.json
  grafana_dashboard_crowdsec:
    file: ./monitoring/dashboard-crowdsec.json
  pve_exporter_config:
    file: ./monitoring/pve.yml