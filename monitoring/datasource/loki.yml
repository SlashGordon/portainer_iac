apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    # Da Grafana und Loki im plg_net sind, reicht der Container-Name
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Optional: Erhöht das Limit der abrufbaren Log-Zeilen für bessere Statistiken
      maxLines: 5000
