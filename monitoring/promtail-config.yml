server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. UBUNTU LOGIN LOGS (The "Important Stuff")
  - job_name: systemd-journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: docker-host
    relabel_configs:
      # This pulls the 'Unit' (like ssh.service) so you can filter by it
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      # This catches the 'Reason' (like sshd)
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'syslog_identifier'
  # 2. DOCKER CONTAINER LOGS 
  - job_name: docker_scrape
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

    pipeline_stages:
      # NGINX containers: parse JSON access logs
      - match:
          selector: '{container=~"moneywebprd|moneywebdev|blogastroprd|portfoliomanagerdev|giteabuildexplorer|patioplannerprd|druckzugproprd"}'
          stages:
            - docker: {}
            - json:
                expressions:
                  remote_addr: remote_addr
                  remote_user: remote_user
                  time_local: time_local
                  request: request
                  request_uri: request_uri
                  status: status
                  body_bytes_sent: body_bytes_sent
                  bytes_sent: bytes_sent
                  http_referer: http_referer
                  http_user_agent: http_user_agent
                  http_x_forwarded_for: http_x_forwarded_for
                  http_host: http_host
                  host: http_host
                  server_name: server_name
                  request_time: request_time
                  request_method: request_method
                  request_length: request_length
                  upstream: upstream
                  upstream_connect_time: upstream_connect_time
                  upstream_header_time: upstream_header_time
                  upstream_response_time: upstream_response_time
                  upstream_response_length: upstream_response_length
                  upstream_cache_status: upstream_cache_status
                  scheme: scheme
                  server_protocol: server_protocol
                  geoip_country_code: geoip_country_code
                  http_cf_ray: http_cf_ray
            - labels:
                status:
                request_method:
                host:
                server_name:
                scheme:
                geoip_country_code:
