services:
  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami
    secrets:
      - umami_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    entrypoint:
      - node
      - -e
      - |
        const { readFileSync } = require('fs');
        const { execSync } = require('child_process');
        const dbPass = readFileSync('/run/secrets/umami_db_password', 'utf8').trim();
        const appSecret = readFileSync('/run/secrets/umami_app_secret', 'utf8').trim();
        process.env.DATABASE_URL = 'postgresql://umami:' + encodeURIComponent(dbPass) + '@umami-db:5432/umami';
        process.env.APP_SECRET = appSecret;
        process.env.DISABLE_TELEMETRY = '1';
        process.env.TRACKER_SCRIPT_NAME = 'getinfo';
        
        // Execute Prisma database migrations automatically
        console.log('Running database migrations...');
        execSync('pnpm exec prisma migrate deploy', { stdio: 'inherit' });
        
        require('./server.js');
    environment:
      TRACKER_SCRIPT_NAME: getinfo
    networks:
      - umami
      - apps
    secrets:
      - umami_db_password
      - umami_app_secret
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=apps"
      # Main router (catch-all, protected by CrowdSec)
      - "traefik.http.routers.umami.rule=Host(`umami.dieck-labs.de`)"
      - "traefik.http.routers.umami.entrypoints=web"
      - "traefik.http.routers.umami.middlewares=crowdsec@docker"
      - "traefik.http.routers.umami.priority=1"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      # Tracker script: /getinfo.js -> /script.js (no CrowdSec)
      - "traefik.http.routers.umami-tracker.rule=Host(`umami.dieck-labs.de`) && Path(`/getinfo.js`)"
      - "traefik.http.routers.umami-tracker.entrypoints=web"
      - "traefik.http.routers.umami-tracker.middlewares=umami-rewrite@docker"
      - "traefik.http.routers.umami-tracker.priority=10"
      - "traefik.http.routers.umami-tracker.service=umami"
      - "traefik.http.middlewares.umami-rewrite.replacepathregex.regex=^/getinfo\\.js$$"
      - "traefik.http.middlewares.umami-rewrite.replacepathregex.replacement=/script.js"
      # Tracker API: /api/send (no CrowdSec, no rewrite)
      - "traefik.http.routers.umami-api.rule=Host(`umami.dieck-labs.de`) && Path(`/api/send`)"
      - "traefik.http.routers.umami-api.entrypoints=druckzugpro-web-prd:"
      - "traefik.http.routers.umami-api.priority=10"
      - "traefik.http.routers.umami-api.service=umami"


secrets:
  umami_db_password:
    file: /opt/portainer_iac/secrets/secrets/umami/db_password
  umami_app_secret:
    file: /opt/portainer_iac/secrets/secrets/umami/app_secret

volumes:
  umami-db-data:

networks:
  umami:
  apps:
    external: true
