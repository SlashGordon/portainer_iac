services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        set -eu
        export ADMIN_TOKEN="$(cat /run/secrets/admin_token)"
        export SMTP_HOST="$(cat /run/secrets/smtp_host)"
        export SMTP_FROM="$(cat /run/secrets/smtp_from)"
        export SMTP_USERNAME="$(cat /run/secrets/smtp_username)"
        export SMTP_PASSWORD="$(cat /run/secrets/smtp_password)"
        exec /start.sh
    environment:
      DOMAIN: "https://vault.dieck-labs.de"
      WEBSOCKET_ENABLED: true
      SIGNUPS_ALLOWED: false
      # SMTP2GO Configuration
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_FROM_NAME: Vaultwarden
    volumes:
      - vaultwarden-content:/data/
    ports:
      - "3231:80"
    secrets:
      - source: admin_token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_host
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_from
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_username
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_password
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - cloudflare

secrets:
  admin_token:
    file: /opt/portainer_iac/secrets/secrets/vaultwarden/admin_token
  smtp_host:
    file: /opt/portainer_iac/secrets/secrets/vaultwarden/smtp_host
  smtp_from:
    file: /opt/portainer_iac/secrets/secrets/vaultwarden/smtp_from
  smtp_username:
    file: /opt/portainer_iac/secrets/secrets/vaultwarden/smtp_username
  smtp_password:
    file: /opt/portainer_iac/secrets/secrets/vaultwarden/smtp_password

volumes:
  vaultwarden-content:
    external: true

networks:
  cloudflare:
    external: true
